name: APK build

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Sabit imza açarı: ya repodakı signing/ qovluğu (repo private olanda),
      # ya da RADAR_KEYSTORE_B64 + RADAR_KEYSTORE_PASSWORD secret-ləri.
      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.RADAR_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RADAR_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p signing
            echo "$KS_B64" | base64 -d > signing/release.jks
          fi
          if [ -f signing/release.jks ] && { [ -n "$KS_PASS" ] || [ -s signing/password.txt ]; }; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Sabit imza açarı yoxdur — APK yalnız artifact kimi yüklənir, Release yaradılmır."
          fi

      - name: Test + build
        env:
          RADAR_KEYSTORE_PASSWORD: ${{ secrets.RADAR_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :core:test :app:assembleRelease \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Rename APK
        id: apk
        run: |
          src=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          name="NovbeRadari-$VERSION_NAME.apk"
          cp "$src" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: GitHub Release
        if: steps.key.outputs.stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Növbə Radarı ${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.name }}
          make_latest: "true"
          body: |
            **Növbə Radarı ${{ env.VERSION_NAME }}** (`${{ github.ref_name }}` · ${{ github.sha }})

            Quraşdırma: aşağıdakı **${{ steps.apk.outputs.name }}** faylını telefonda yüklə və aç.
            Köhnə versiya varsa, silmədən üstündən quraşdır — ayarlar qalır.
            Ətraflı: README-dəki "Telefonda quraşdırma" bölməsi.
