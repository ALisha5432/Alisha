<style>
:root{
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --ink: #fbf6ff;
  --ink-soft: rgba(238, 230, 255, .78);
  --gold: #ffd88f;
  --serif: "Cormorant Garamond", "Cormorant", "Noto Serif", Georgia, "Times New Roman", serif;
  --star-size: 64px;
  color-scheme: dark;
}
*{ box-sizing: border-box; margin: 0; padding: 0; }
html, body{
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
  background: #04050f;
}
body{
  position: fixed;
  inset: 0;
  color: var(--ink);
  font-family: var(--serif);
  font-weight: 500;
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
button{
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
button:focus{ outline: none; }
button:focus-visible{ outline: 2px solid rgba(255, 220, 170, .65); outline-offset: 4px; }

/* ---------- Səma ---------- */
#sky{
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  background: linear-gradient(180deg, #02030c 0%, #050a22 24%, #0d1140 50%, #1f1550 74%, #36195a 92%, #3e1b58 100%);
}
#sky::before{
  content: "";
  position: absolute;
  inset: -20%;
  background:
    radial-gradient(42% 30% at 22% 70%, rgba(150, 82, 214, .22), transparent 70%),
    radial-gradient(36% 26% at 84% 86%, rgba(232, 110, 172, .15), transparent 70%),
    radial-gradient(46% 30% at 66% 28%, rgba(76, 98, 224, .12), transparent 70%),
    linear-gradient(124deg, transparent 36%, rgba(176, 166, 255, .06) 50%, transparent 64%);
  animation: nebula 70s ease-in-out infinite alternate;
  will-change: transform;
}
#sky::after{
  content: "";
  position: absolute;
  left: -10%;
  right: -10%;
  bottom: -12%;
  height: 46%;
  background: radial-gradient(60% 72% at 50% 100%, rgba(128, 60, 150, .34), transparent 72%);
}
@keyframes nebula{
  from{ transform: translate3d(-2%, 1%, 0) scale(1); }
  to{ transform: translate3d(2%, -2%, 0) scale(1.07); }
}

canvas{
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#bg{ z-index: 1; }
#fx{ z-index: 4; }

/* ---------- Ay ---------- */
#moon{
  position: fixed;
  z-index: 2;
  top: calc(var(--safe-t) + 20px);
  right: calc(var(--safe-r) + 20px);
  width: clamp(46px, 13vw, 76px);
  height: clamp(46px, 13vw, 76px);
  pointer-events: none;
  animation: moonFloat 14s ease-in-out infinite;
}
#moon .moon-halo{
  position: absolute;
  inset: -80%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 230, 186, .20) 0%, rgba(255, 230, 186, .07) 34%, transparent 64%);
  animation: moonGlow 8s ease-in-out infinite;
}
#moon svg{
  position: relative;
  width: 100%;
  height: 100%;
  overflow: visible;
  filter: drop-shadow(0 0 7px rgba(255, 232, 190, .55));
}
@keyframes moonFloat{
  0%, 100%{ transform: translate3d(0, 0, 0) rotate(0deg); }
  50%{ transform: translate3d(0, 5px, 0) rotate(-3deg); }
}
@keyframes moonGlow{
  0%, 100%{ opacity: .75; transform: scale(1); }
  50%{ opacity: 1; transform: scale(1.06); }
}

/* ---------- Mesaj ulduzları ---------- */
#stars{
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
.star{
  position: absolute;
  left: 0;
  top: 0;
  width: var(--star-size);
  height: var(--star-size);
  border-radius: 50%;
  pointer-events: none;
  will-change: transform;
  transform: translate3d(-200px, -200px, 0);
}
.star.shown{ pointer-events: auto; }
body.forming .star{ pointer-events: none; }
.star .appear{
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: scale(.2);
  transition: opacity 1.3s ease, transform 1.5s cubic-bezier(.2, .9, .25, 1.15);
}
.star.shown .appear{ opacity: 1; transform: scale(1); }
.star .press{
  position: absolute;
  inset: 0;
  transition: transform .28s cubic-bezier(.3, 1.6, .5, 1);
}
.star:active .press{ transform: scale(.86); }
.star .body{
  position: absolute;
  inset: 0;
  animation: breathe var(--bd, 4.2s) ease-in-out var(--bdl, 0s) infinite;
}
.skin{
  position: absolute;
  inset: 0;
  transition: opacity 1.6s ease;
}
.skin.gold{ opacity: 0; }
.star.open .skin.gold{ opacity: 1; }
.star.open .skin.silver{ opacity: 0; }
.halo{
  position: absolute;
  inset: -34%;
  border-radius: 50%;
  background: radial-gradient(circle, var(--g1) 0%, var(--g2) 30%, transparent 68%);
  animation: haloPulse var(--bd, 4.2s) ease-in-out var(--bdl, 0s) infinite;
}
.silver{ --g1: rgba(204, 218, 255, .52); --g2: rgba(150, 168, 255, .17); }
.gold{ --g1: rgba(255, 216, 146, .72); --g2: rgba(255, 172, 84, .22); }
.rays{
  position: absolute;
  left: 4%;
  top: 4%;
  width: 92%;
  height: 92%;
  overflow: visible;
  animation: twinkle var(--rd, 8s) ease-in-out var(--bdl, 0s) infinite;
}
.core{
  position: absolute;
  left: 39%;
  top: 39%;
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #fff 34%, rgba(255, 255, 255, 0) 72%);
}
@keyframes breathe{
  0%, 100%{ transform: scale(.84); }
  50%{ transform: scale(1.07); }
}
@keyframes haloPulse{
  0%, 100%{ opacity: .5; }
  50%{ opacity: 1; }
}
@keyframes twinkle{
  0%, 100%{ transform: rotate(-9deg) scale(.95); }
  50%{ transform: rotate(9deg) scale(1.05); }
}

/* ---------- İpucu və sayğac ---------- */
#hint{
  position: fixed;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: calc(var(--safe-b) + 80px);
  text-align: center;
  font-style: italic;
  font-size: 20px;
  letter-spacing: .02em;
  color: var(--ink-soft);
  text-shadow: 0 0 14px rgba(190, 170, 255, .45);
  opacity: 0;
  transition: opacity 1.2s ease;
  pointer-events: none;
}
#hint.show{ opacity: 1; animation: hintBreath 3.6s ease-in-out infinite; }
@keyframes hintBreath{
  0%, 100%{ opacity: .55; }
  50%{ opacity: 1; }
}
#counter{
  position: fixed;
  z-index: 5;
  left: 0;
  right: 0;
  bottom: calc(var(--safe-b) + 20px);
  margin: 0 auto;
  width: max-content;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px 9px 16px;
  border-radius: 999px;
  font-size: 20px;
  letter-spacing: .06em;
  font-variant-numeric: lining-nums tabular-nums;
  font-feature-settings: "lnum" 1, "tnum" 1;
  color: var(--ink);
  opacity: 0;
  transition: opacity 1s ease, color 1s ease;
  pointer-events: none;
}
#counter.show{ opacity: 1; }
#counter svg{ width: 15px; height: 15px; flex: none; filter: drop-shadow(0 0 5px rgba(255, 205, 130, .8)); }
#counter .sep{ opacity: .55; margin: 0 .12em; }
#counter.bump{ animation: bump .75s cubic-bezier(.3, 1.5, .5, 1); }
#counter.full{ color: var(--gold); }
@keyframes bump{
  0%{ transform: scale(1); }
  35%{ transform: scale(1.14); box-shadow: 0 0 30px rgba(255, 210, 140, .45); }
  100%{ transform: scale(1); }
}

/* ---------- Şüşə ---------- */
.glass{
  background: linear-gradient(155deg, rgba(255, 255, 255, .17) 0%, rgba(255, 255, 255, .07) 46%, rgba(255, 228, 244, .08) 100%);
  border: 1px solid rgba(255, 255, 255, .24);
  box-shadow:
    0 30px 70px -22px rgba(3, 2, 20, .75),
    inset 0 1px 0 rgba(255, 255, 255, .28),
    0 0 52px -12px rgba(190, 160, 255, .28);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  backdrop-filter: blur(20px) saturate(160%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass{ background: linear-gradient(155deg, rgba(52, 44, 104, .94), rgba(28, 22, 66, .94)); }
}

/* ---------- Giriş ---------- */
#intro{
  position: fixed;
  inset: 0;
  z-index: 9;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(30px, 6vh, 48px);
  padding: calc(var(--safe-t) + 24px) calc(var(--safe-r) + 26px) calc(var(--safe-b) + 24px) calc(var(--safe-l) + 26px);
  text-align: center;
  transition: opacity 1.2s ease, transform 1.6s ease, filter 1.2s ease;
}
#intro.hide{
  opacity: 0;
  transform: scale(1.06);
  filter: blur(6px);
  pointer-events: none;
}
#intro.gone{ display: none; }
.intro-spark{
  width: 34px;
  height: 34px;
  margin-bottom: -10px;
  filter: drop-shadow(0 0 10px rgba(255, 214, 150, .8));
}
.intro-spark svg{ width: 100%; height: 100%; animation: spin 18s linear infinite; }
.title{
  font-style: italic;
  font-weight: 500;
  font-size: clamp(32px, 9.6vw, 54px);
  line-height: 1.2;
  letter-spacing: .005em;
  max-width: 12.5em;
  text-wrap: balance;
  text-shadow: 0 0 26px rgba(190, 170, 255, .38);
}
.title .name{
  display: inline-block;
  white-space: nowrap;
  padding: 0 .06em;
  background: linear-gradient(100deg, #ffe4a8 0%, #ffc4d8 60%, #ead0ff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  text-shadow: none;
  filter: drop-shadow(0 0 14px rgba(255, 200, 175, .35));
}
.start{
  position: relative;
  min-width: 168px;
  padding: 15px 44px 16px calc(44px + .3em);
  border-radius: 999px;
  font-size: 18px;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: #fff6e6;
  background: linear-gradient(180deg, rgba(255, 255, 255, .17), rgba(255, 255, 255, .05));
  border: 1px solid rgba(255, 222, 172, .5);
  box-shadow: 0 0 26px rgba(255, 196, 140, .25), inset 0 1px 0 rgba(255, 255, 255, .3);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  transition: transform .25s cubic-bezier(.3, 1.6, .5, 1), box-shadow .3s ease;
}
.start::before{
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  border: 1px solid rgba(255, 214, 160, .55);
  animation: ring 3s ease-out infinite;
  pointer-events: none;
}
.start:active{ transform: scale(.95); }
@keyframes ring{
  from{ transform: scale(1); opacity: .75; }
  to{ transform: scale(1.3, 1.6); opacity: 0; }
}
.fade{ opacity: 0; }
body.ready .fade{ animation: fadeUp 1.8s cubic-bezier(.2, .7, .2, 1) forwards; }
body.ready .fade.d1{ animation-delay: .2s; }
body.ready .fade.d2{ animation-delay: .55s; }
body.ready .fade.d3{ animation-delay: 1.35s; }
@keyframes fadeUp{
  from{ opacity: 0; transform: translate3d(0, 16px, 0); filter: blur(4px); }
  to{ opacity: 1; transform: none; filter: blur(0); }
}
@keyframes spin{ to{ transform: rotate(360deg); } }

/* ---------- Mesaj kartı ---------- */
#overlay{
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--safe-t) + 22px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 22px) calc(var(--safe-l) + 18px);
  background: radial-gradient(120% 90% at 50% 50%, rgba(10, 6, 34, .28), rgba(3, 2, 14, .62));
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .45s ease, visibility 0s linear .5s;
}
#overlay.show{
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity .45s ease;
}
.card{
  position: relative;
  width: min(100%, 410px);
  max-height: 100%;
  overflow: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 40px 28px 34px;
  border-radius: 28px;
  text-align: center;
}
.card::before{
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: radial-gradient(120% 60% at 12% 0%, rgba(255, 255, 255, .16), transparent 52%);
  pointer-events: none;
}
#card{
  opacity: 0;
  transform: scale(.18);
  transition: transform .4s cubic-bezier(.5, 0, .75, 0), opacity .35s ease .05s;
}
#overlay.show #card{
  opacity: 1;
  transform: none;
  transition: transform .62s cubic-bezier(.18, .9, .3, 1.05), opacity .38s ease;
}
.card-ico{
  width: 30px;
  height: 30px;
  margin: 0 auto 16px;
  filter: drop-shadow(0 0 9px rgba(255, 200, 120, .75));
}
.card-ico svg{ width: 100%; height: 100%; animation: spin 16s linear infinite; }
.close{
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 2;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: rgba(255, 255, 255, .72);
  transition: background .2s ease, color .2s ease;
}
.close svg{ width: 15px; height: 15px; }
.close:active{ background: rgba(255, 255, 255, .12); color: #fff; }
.msg{
  position: relative;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(23px, 6.4vw, 29px);
  line-height: 1.4;
  color: #fff9f1;
  text-shadow: 0 0 18px rgba(255, 222, 182, .28);
  text-wrap: balance;
  overflow-wrap: break-word;
}
.typed .ch{ opacity: 0; }
.typed .ch.on{ opacity: 1; animation: ink .6s ease-out; }
.typed.all .ch{ opacity: 1; animation: none; }
@keyframes ink{
  from{ opacity: 0; text-shadow: 0 0 14px rgba(255, 216, 150, .95); }
  to{ opacity: 1; text-shadow: 0 0 0 rgba(255, 216, 150, 0); }
}

/* ---------- Final ---------- */
#finale{
  position: fixed;
  z-index: 6;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0 calc(var(--safe-r) + 16px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 16px);
  visibility: hidden;
  pointer-events: none;
}
#finale.show{ visibility: visible; }
#finalCard{
  width: min(100%, 470px);
  max-height: 58vh;
  max-height: 58dvh;
  padding: 26px 24px 26px;
  opacity: 0;
  transform: translate3d(0, 34px, 0) scale(.96);
  transition: opacity 1.2s ease, transform 1.6s cubic-bezier(.2, .8, .2, 1);
}
#finale.show #finalCard{
  opacity: 1;
  transform: none;
  pointer-events: auto;
}
.heart-ico{
  width: 34px;
  height: 34px;
  margin: 0 auto 12px;
  filter: drop-shadow(0 0 10px rgba(255, 130, 170, .8));
}
.heart-ico svg{ width: 100%; height: 100%; animation: beat 1.9s ease-in-out infinite; }
@keyframes beat{
  0%, 30%, 100%{ transform: scale(1); }
  8%{ transform: scale(1.14); }
  18%{ transform: scale(1.04); }
  24%{ transform: scale(1.1); }
}
#finalMsg{
  font-size: clamp(20px, 5.5vw, 25px);
  line-height: 1.45;
  text-wrap: pretty;
}
.again{
  display: inline-flex;
  align-items: center;
  gap: 9px;
  min-height: 46px;
  padding: 10px 22px;
  border-radius: 999px;
  font-size: 17px;
  font-style: italic;
  letter-spacing: .04em;
  color: var(--ink-soft);
  opacity: 0;
  transition: opacity 1.6s ease;
}
.again svg{ width: 15px; height: 15px; }
#finale.show .again.show{ opacity: 1; pointer-events: auto; }
.again:active{ color: #fff; }

@media (max-height: 720px){
  #finalCard{ padding: 18px 18px 18px; }
  .heart-ico{ width: 26px; height: 26px; margin-bottom: 8px; }
  #finalMsg{ font-size: 19.5px; line-height: 1.36; }
  .again{ min-height: 40px; padding: 8px 18px; font-size: 16px; }
}
@media (max-height: 600px){
  .heart-ico{ display: none; }
  #finalMsg{ font-size: 19px; }
}

body.landscape #finale{
  left: auto;
  top: 0;
  width: min(52vw, 500px);
  justify-content: center;
  padding: calc(var(--safe-t) + 12px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 6px) 8px;
}
body.landscape #finalCard{ max-height: calc(100% - 52px); }

.sr-only{
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce){
  .star .body, .halo, .rays, #moon, #sky::before{ animation-duration: 12s; }
  body.ready .fade{ animation-duration: .9s; }
}
</style>
</head>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:22px;z-index:20">Bu səhifə üçün JavaScript açıq olmalıdır.</p></noscript>

<!-- Ulduzlar üçün rəng keçidləri -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gS" cx="0" cy="0" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#eef2ff"/>
      <stop offset=".75" stop-color="#b3c4ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9fb2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gG" cx="0" cy="0" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#fff0c8"/>
      <stop offset=".75" stop-color="#ffc266" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffab45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2e2"/>
      <stop offset=".55" stop-color="#ff8fb4"/>
      <stop offset="1" stop-color="#ffc58a"/>

<script>
(() => {
  'use strict';

  /* ================= köməkçilər ================= */
  const $ = (s) => document.querySelector(s);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const MSGS = (typeof MESAJLAR !== 'undefined' && Array.isArray(MESAJLAR) ? MESAJLAR : [])

    .filter(Boolean);
  const FINAL_TEXT = typeof SON_MESAJ !== 'undefined' ? String(SON_MESAJ).trim() : '';
  const N = MSGS.length;

  let personName = typeof AD !== 'undefined' ? String(AD || '').trim() : '';
  try {
    const q = new URLSearchParams(location.search).get('ad');
    if (q && q.trim()) personName = q.trim().slice(0, 40);
  } catch (e) { /* köhnə brauzer */ }

  /* ================= elementlər ================= */
  const bg = $('#bg'), fx = $('#fx');
  const bctx = bg.getContext('2d'), fctx = fx.getContext('2d');
  const moonEl = $('#moon'), starsEl = $('#stars');
  const hintEl = $('#hint'), counterEl = $('#counter'), cntEl = $('#cnt'), totEl = $('#tot');
  const intro = $('#intro'), titleEl = $('#title'), startBtn = $('#start');
  const overlay = $('#overlay'), card = $('#card'), msgEl = $('#msg'), closeBtn = $('#close');
  const finale = $('#finale'), finalCard = $('#finalCard'), finalMsg = $('#finalMsg'), againBtn = $('#again');

  /* ================= başlıq ================= */
  if (personName) {
    const nm = document.createElement('span');
    nm.className = 'name';
    nm.textContent = personName;
    titleEl.append(nm, ', bu gecə səma sənin üçündür ✨');
  } else {
    titleEl.textContent = 'Bu gecə səma sənin üçündür ✨';
  }
  totEl.textContent = String(N);

  /* ================= saat və planlayıcı ================= */
  // Öz saatımız: yalnız səhifə görünəndə irəliləyir.
  let clock = 0;
  const queue = [];
  const later = (sec, fn) => { queue.push({ at: clock + sec, fn }); };
  function runQueue() {
    if (!queue.length) return;
    const due = [];
    for (let i = queue.length - 1; i >= 0; i--) {
      if (queue[i].at <= clock) due.push(queue.splice(i, 1)[0]);
    }
    due.sort((a, b) => a.at - b.at);
    for (const q of due) {
      try { q.fn(); } catch (e) { console.error(e); }
    }
  }

  /* ================= səs (Web Audio) ================= */
  let AC = null, OUT = null;
  function ensureAudio() {
    try {
      if (!AC) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        AC = new C();
        const master = AC.createGain();
        master.gain.value = 0.7;
        const tone = AC.createBiquadFilter();
        tone.type = 'lowpass';
        tone.frequency.value = 4200;
        tone.Q.value = 0.4;
        const comp = AC.createDynamicsCompressor();
        comp.threshold.value = -20;
        comp.knee.value = 14;
        comp.ratio.value = 3;
        comp.attack.value = 0.004;
        comp.release.value = 0.3;
        master.connect(tone);
        tone.connect(comp);
        comp.connect(AC.destination);
        // yumşaq əks-səda
        const dl = AC.createDelay(1.2);
        dl.delayTime.value = 0.27;
        const fb = AC.createGain();
        fb.gain.value = 0.34;
        const damp = AC.createBiquadFilter();
        damp.type = 'lowpass';
        damp.frequency.value = 1900;
        const wet = AC.createGain();
        wet.gain.value = 0.3;
        master.connect(dl);
        dl.connect(damp);
        damp.connect(fb);
        fb.connect(dl);
        damp.connect(wet);
        wet.connect(tone);
        OUT = master;
      }
      // iOS səsi 'suspended' və ya 'interrupted' vəziyyətinə sala bilər
      if (AC.state !== 'running' && AC.resume) AC.resume().catch(() => {});
    } catch (e) { AC = null; OUT = null; }
    return AC;
  }
  // yumşaq "ding" — sinus dalğaları, zəng kimi obertonlar
  function bell(freq, vol = 1, when = 0, decay = 2.3) {
    if (!AC || !OUT) return;
    try {
      const t = AC.currentTime + 0.012 + when;
      const parts = [[1, 1, decay], [2.01, 0.17, decay * 0.42], [3.0, 0.05, decay * 0.28], [0.5, 0.07, decay * 0.9]];
      for (const [r, g, d] of parts) {
        const o = AC.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * r;
        const gn = AC.createGain();
        const peak = Math.max(0.0002, 0.17 * g * vol);
        gn.gain.setValueAtTime(0.0001, t);
        gn.gain.exponentialRampToValueAtTime(peak, t + 0.012);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(gn);
        gn.connect(OUT);
        o.start(t);
        o.stop(t + d + 0.05);
      }
    } catch (e) { /* səs olmasa da davam */ }
  }
  function pad(freq, vol, when, attack, dur) {
    if (!AC || !OUT) return;
    try {
      const t = AC.currentTime + 0.02 + when;
      for (const [r, g] of [[1, 1], [2, 0.12]]) {
        const o = AC.createOscillator();
        o.type = 'sine';
        o.frequency.value = freq * r;
        const gn = AC.createGain();
        gn.gain.setValueAtTime(0.0001, t);
        gn.gain.exponentialRampToValueAtTime(Math.max(0.0002, 0.07 * vol * g), t + attack);
        gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(gn);
        gn.connect(OUT);
        o.start(t);
        o.stop(t + dur + 0.1);
      }
    } catch (e) { /* */ }
  }
  // G major pentatonika
  const SCALE = [587.33, 659.25, 783.99, 880.0, 987.77, 1174.66, 1318.51, 1567.98, 1760.0, 1975.53];
  const ARP = [783.99, 880.0, 987.77, 1174.66, 1318.51, 1567.98, 1760.0, 1975.53];
  const buzz = (ms) => { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* */ } };

  /* ================= ölçülər ================= */
  let W = 0, H = 0, DPR = 1, S = 64, AMP = 14, landscape = false;
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';
  document.body.appendChild(probe);
  function safe() {
    const cs = getComputedStyle(probe);
    return {
      t: parseFloat(cs.paddingTop) || 0,
      r: parseFloat(cs.paddingRight) || 0,
      b: parseFloat(cs.paddingBottom) || 0,
      l: parseFloat(cs.paddingLeft) || 0,
    };
  }

  /* ================= arxa fon ulduzları ================= */
  function makeSprite(rgb) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.12, `rgba(${rgb},0.95)`);
    grd.addColorStop(0.32, `rgba(${rgb},0.3)`);
    grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return c;
  }
  const SPR = {
    white: makeSprite('255,255,255'),
    blue: makeSprite('196,212,255'),
    warm: makeSprite('255,230,196'),
    lilac: makeSprite('226,204,255'),
    gold: makeSprite('255,212,140'),
    rose: makeSprite('255,170,205'),
  };
  const FIELD_TINTS = [SPR.white, SPR.white, SPR.blue, SPR.blue, SPR.warm, SPR.lilac];

  let field = [], sparkles = [], fieldArea = 0;
  function gauss() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
  }
  function buildField() {
    fieldArea = W * H;
    const n = Math.round(clamp(fieldArea / 1100, 170, 560));
    field = [];
    // Süd Yolu kimi diaqonal zolaq
    const ax = -W * 0.15, ay = H * 0.95, bx = W * 1.15, by = H * 0.05;
    const lx = bx - ax, ly = by - ay, ll = Math.hypot(lx, ly);
    const px = -ly / ll, py = lx / ll;
    const spread = Math.min(W, H) * 0.13;
    for (let i = 0; i < n; i++) {
      let x, y;
      if (Math.random() < 0.3) {
        const u = Math.random(), o = gauss() * spread;
        x = ax + lx * u + px * o;
        y = ay + ly * u + py * o;
        x = ((x % W) + W) % W;
        y = ((y % H) + H) % H;
      } else {
        x = Math.random() * W;
        y = Math.random() * H;
      }
      const r = 0.35 + Math.pow(Math.random(), 2.6) * 1.35;
      field.push({
        x, y, r,
        a: 0.35 + Math.random() * 0.65,
        s: 0.4 + Math.random() * 1.9,
        p: Math.random() * TAU,
        spr: FIELD_TINTS[(Math.random() * FIELD_TINTS.length) | 0],
        v: 1.1 + r * 1.7,
      });
    }
    sparkles = [];
    const m = Math.round(clamp(fieldArea / 45000, 6, 14));
    for (let i = 0; i < m; i++) {
      sparkles.push({
        x: Math.random() * W, y: Math.random() * H * 0.85,
        r: 1.5 + Math.random() * 0.9,
        s: 0.35 + Math.random() * 0.6, p: Math.random() * TAU,
        v: 3.6 + Math.random(),
        spr: Math.random() < 0.5 ? SPR.white : SPR.blue,
      });
    }
  }

  /* ---------- axan ulduzlar ---------- */
  const shooters = [];
  let nextShoot = 2.8;
  function spawnShooter() {
    const dir = Math.random() < 0.5 ? -1 : 1;
    const ang = Math.PI * (0.13 + Math.random() * 0.13);
    const k = clamp(Math.hypot(W, H) / 900, 0.7, 1.5);
    const speed = (620 + Math.random() * 420) * k;
    const x = dir < 0 ? W * (0.35 + Math.random() * 0.75) : W * (-0.1 + Math.random() * 0.65);
    const y = H * (Math.random() * 0.45) - 10;
    shooters.push({
      x, y,
      vx: Math.cos(ang) * speed * dir,
      vy: Math.sin(ang) * speed,
      t: 0,
      max: 0.85 + Math.random() * 0.55,
      len: (80 + Math.random() * 110) * k,
    });
  }

  /* ================= mesaj ulduzları ================= */
  const RAY = 'M0-48C2.6-12 12-2.6 48 0 12 2.6 2.6 12 0 48-2.6 12-12 2.6-48 0-12-2.6-2.6-12 0-48Z';
  const raysSvg = (g) =>
    `<svg class="rays" viewBox="-50 -50 100 100" aria-hidden="true" focusable="false"><path d="${RAY}" fill="url(#${g})"/><path d="${RAY}" fill="url(#${g})" opacity=".72" transform="rotate(45) scale(.5)"/></svg>`;
  const STAR_HTML =
    '<span class="appear"><span class="press"><span class="body">' +
    `<span class="skin silver"><span class="halo"></span>${raysSvg('gS')}</span>` +
    `<span class="skin gold"><span class="halo"></span>${raysSvg('gG')}</span>` +
    '<span class="core"></span></span></span></span>';

  const stars = MSGS.map((msg, i) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'star';
    el.setAttribute('aria-label', `Ulduz ${i + 1}`);
    el.innerHTML = STAR_HTML;
    el.style.setProperty('--bd', rand(3.6, 5.2).toFixed(2) + 's');
    el.style.setProperty('--bdl', (-rand(0, 5)).toFixed(2) + 's');
    el.style.setProperty('--rd', rand(6, 10).toFixed(2) + 's');
    starsEl.appendChild(el);
    const st = {
      i, el, msg,
      opened: false,
      nx: 0.5, ny: 0.5,      // normallaşdırılmış mövqe
      bx: 0, by: 0,          // səpələnmiş mövqe (px)
      ax: 0, ay: 0,          // lövbər (hərəkətsiz mərkəz)
      x: -999, y: -999,      // cari mövqe
      tw: null,              // keçid animasiyası
      hk: i,                 // ürəkdəki yeri
      note: SCALE[i % SCALE.length],
      p1: Math.random() * TAU, p2: Math.random() * TAU,
      w1: TAU / rand(7, 12), w2: TAU / rand(9, 15),
      pop: -1, popAmp: 0.32,
    };
    el.addEventListener('click', () => tapStar(st));
    return st;
  });

  function scatterRect() {
    const sa = safe();
    const mx = Math.max(S * 0.55 + AMP + 6, W * 0.07);
    const left = sa.l + mx;
    const right = W - sa.r - mx;
    const top = sa.t + Math.max(S * 0.55 + AMP + 10, H * 0.07);
    const bottom = H - sa.b - 100 - S * 0.3 - AMP;
    return { left, top, w: Math.max(10, right - left), h: Math.max(10, bottom - top) };
  }
  function moonZone() {
    const r = moonEl.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2, r: r.width * 0.62 + S * 0.5 + AMP };
  }
  function minPairDist(pts) {
    let mn = Infinity;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        mn = Math.min(mn, Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y));
      }
    }
    return mn;
  }
  // "Ən yaxşı namizəd" üsulu: ulduzlar bərabər səpələnir, üst-üstə düşmür
  function makeLayout() {
    const R = scatterRect(), mz = moonZone();
    let best = null, bestMin = -1;
    for (let trial = 0; trial < 16; trial++) {
      const pts = [];
      for (let i = 0; i < N; i++) {
        let cand = null, score = -Infinity;
        for (let k = 0; k < 40; k++) {
          const x = R.left + Math.random() * R.w;
          const y = R.top + Math.random() * R.h;
          const dm = Math.hypot(x - mz.x, y - mz.y) - mz.r;
          if (dm < 0) continue;
          let d = dm + S;
          for (const p of pts) d = Math.min(d, Math.hypot(p.x - x, p.y - y));
          if (d > score) { score = d; cand = { x, y }; }
        }
        if (!cand) cand = { x: R.left + Math.random() * R.w, y: R.top + R.h * (0.4 + Math.random() * 0.6) };
        pts.push(cand);
      }
      const mn = minPairDist(pts);
      if (mn > bestMin) { bestMin = mn; best = pts; }
    }
    best.forEach((p, i) => {
      const st = stars[i];
      st.bx = p.x; st.by = p.y;
      st.nx = (p.x - R.left) / R.w;
      st.ny = (p.y - R.top) / R.h;
    });
    assignNotes();
  }
  function remapLayout() {
    const R = scatterRect();
    stars.forEach((st) => {
      st.bx = R.left + st.nx * R.w;
      st.by = R.top + st.ny * R.h;
    });
    const mz = moonZone();
    const moonHit = stars.some((st) => Math.hypot(st.bx - mz.x, st.by - mz.y) < mz.r * 0.8);
    return N < 2 || (minPairDist(stars.map((s) => ({ x: s.bx, y: s.by }))) >= S + AMP && !moonHit);
  }
  // Yuxarıdakı ulduzlar daha zil səslənir
  function assignNotes() {
    const order = stars.slice().sort((a, b) => b.by - a.by);
    order.forEach((st, r) => {
      const idx = N > 1 ? Math.round((r * (SCALE.length - 1)) / (N - 1)) : 4;
      st.note = SCALE[idx];
    });
  }

  /* ================= ürək ================= */
  const HEART_RATIO = 29 / 32;
  function heartCurve(t) {
    const s = Math.sin(t);
    return {
      x: 16 * s * s * s,
      y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)),
    };
  }
  // Ürək xətti üzərində bərabər məsafəli nöqtələr (0 = yuxarı çuxur, n/2 = aşağı uc)
  function heartPoints(n) {
    const M = 2400, acc = [0];
    let L = 0, prev = heartCurve(0);
    for (let k = 1; k <= M; k++) {
      const p = heartCurve((TAU * k) / M);
      L += Math.hypot(p.x - prev.x, p.y - prev.y);
      acc.push(L);
      prev = p;
    }
    const pts = [];
    let k = 0;
    for (let j = 0; j < n; j++) {
      const target = (L * j) / n;
      while (k < M - 1 && acc[k + 1] < target) k++;
      const seg = acc[k + 1] - acc[k] || 1;
      const f = (target - acc[k]) / seg;
      const p = heartCurve((TAU * (k + f)) / M);
      pts.push({ x: p.x / 32, y: (p.y - 2.5) / 29 });
    }
    return { pts, perim: L / 32 };
  }
  const HEART = heartPoints(Math.max(N, 1));
  const HP = HEART.pts;

  let mode = 'scatter';   // 'scatter' | 'heart'
  let stage = 'center';   // 'center' | 'top'
  let heart = { cx: 0, cy: 0, w: 100 };
  let heartAnim = null;
  let hg = heart;

  function heartBox(left, top, right, bottom, maxW) {
    const m = S * 0.42;
    const bw = Math.max(40, right - left - 2 * m);
    const bh = Math.max(40, bottom - top - 2 * m);
    const w = Math.max(60, Math.min(bw, bh / HEART_RATIO, maxW));
    return { cx: (left + right) / 2, cy: (top + bottom) / 2, w };
  }
  function geomCenter() {
    const sa = safe();
    if (landscape) {
      return heartBox(sa.l + 16, sa.t + 12, W - sa.r - 16, H - sa.b - 12, Math.min(W * 0.5, 460));
    }
    let top = sa.t + H * 0.17;
    const bottom = H - sa.b - H * 0.17;
    const maxW = Math.min(W * 0.84, 440);
    let g = heartBox(sa.l + 10, top, W - sa.r - 10, bottom, maxW);
    for (let guard = 0; guard < 40 && heartHitsMoon(g); guard++) {
      top += 5;
      g = heartBox(sa.l + 10, top, W - sa.r - 10, bottom, maxW);
    }
    return g;
  }
  // Ürəyin ulduzları ayın üstünə düşürmü? (yalnız real nöqtələr yoxlanılır)
  function heartHitsMoon(g) {
    const mr = moonEl.getBoundingClientRect();
    const mx = mr.left + mr.width / 2, my = mr.top + mr.height / 2;
    const rr = mr.width * 0.58 + S * 0.42;
    return HP.some((p) => Math.hypot(g.cx + p.x * g.w - mx, g.cy + p.y * g.w * HEART_RATIO - my) < rr);
  }
  function geomTop() {
    const sa = safe();
    if (landscape) {
      const fl = finale.getBoundingClientRect().left;
      return heartBox(sa.l + 14, sa.t + 12, fl - 6, H - sa.b - 12, 440);
    }
    const bottom = H - finale.offsetHeight - 8;
    let top = sa.t + 10;
    const maxW = Math.min(W * 0.8, 420);
    let g = heartBox(sa.l + 10, top, W - sa.r - 10, bottom, maxW);
    for (let guard = 0; guard < 40 && heartHitsMoon(g) && bottom - top > 120; guard++) {
      top += 5;
      g = heartBox(sa.l + 10, top, W - sa.r - 10, bottom, maxW);
    }
    return g;
  }
  function heartNow() {
    if (heartAnim) {
      const u = (clock - heartAnim.t0) / heartAnim.dur;
      if (u >= 1) { heartAnim = null; return heart; }
      const e = easeIO(clamp(u, 0, 1));
      const a = heartAnim.from, b = heartAnim.to;
      return { cx: lerp(a.cx, b.cx, e), cy: lerp(a.cy, b.cy, e), w: lerp(a.w, b.w, e) };
    }
    return heart;
  }
  function beatShape(t) {
    const p = (t % 1.9) / 1.9;
    return Math.exp(-Math.pow((p - 0.07) / 0.045, 2)) + 0.6 * Math.exp(-Math.pow((p - 0.24) / 0.05, 2));
  }
  // Ulduzları ürək nöqtələrinə ən qısa yolla yerləşdir
  function assignHeart() {
    if (!N) return;
    let mx = 0, my = 0;
    stars.forEach((s) => { mx += s.ax; my += s.ay; });
    mx /= N; my /= N;
    const sa = stars
      .map((st) => ({ st, a: Math.atan2(st.ay - my, st.ax - mx) }))
      .sort((a, b) => a.a - b.a);
    const ha = HP
      .map((p, k) => ({ k, a: Math.atan2(p.y * HEART_RATIO, p.x), x: hg.cx + p.x * hg.w, y: hg.cy + p.y * hg.w * HEART_RATIO }))
      .sort((a, b) => a.a - b.a);
    let bestR = 0, bestCost = Infinity;
    for (let r = 0; r < N; r++) {
      let c = 0;
      for (let i = 0; i < N; i++) {
        const h = ha[(i + r) % N], st = sa[i].st;
        c += (st.ax - h.x) ** 2 + (st.ay - h.y) ** 2;
      }
      if (c < bestCost) { bestCost = c; bestR = r; }
    }
    for (let i = 0; i < N; i++) sa[i].st.hk = ha[(i + bestR) % N].k;
  }

  /* ================= vəziyyət ================= */
  let phase = 'intro';     // intro | play | forming | final
  let openedCount = 0;
  let current = null;      // açıq kart
  let typer = null, finalTyper = null;
  let busy = false;
  const lines = { on: false, t0: 0, alpha: 0, target: 0 };
  const STEP = 0.46;
  let glow = 0, glowT = 0, beatAmt = 0, beatT = 0, drift = 1, driftT = 1, sScale = 1;
  let beatVal = 0;
  let moteTimer = 0;

  /* ================= yazı effekti ================= */
  const segmenter = typeof Intl !== 'undefined' && Intl.Segmenter ? new Intl.Segmenter('az', { granularity: 'grapheme' }) : null;
  const graphemes = (s) => (segmenter ? Array.from(segmenter.segment(s), (x) => x.segment) : Array.from(s));

  function makeTyper(el, text, speed) {
    el.textContent = '';
    el.classList.remove('all');
    const chars = graphemes(text);
    const frag = document.createDocumentFragment();
    const spans = chars.map((ch) => {
      const sp = document.createElement('span');
      sp.className = 'ch';
      sp.textContent = ch;
      sp.setAttribute('aria-hidden', 'true');
      frag.appendChild(sp);
      return sp;
    });
    const sr = document.createElement('span');
    sr.className = 'sr-only';
    sr.textContent = text;
    el.append(sr, frag);
    let i = 0, timer = 0, done = false, cancelled = false, started = false;
    const api = {
      onDone: null,
      get done() { return done; },
      start() {
        if (started || cancelled) return;
        started = true;
        tick();
      },
      finish() {
        if (done || cancelled) return;
        clearTimeout(timer);
        el.classList.add('all');
        for (; i < spans.length; i++) spans[i].classList.add('on');
        complete();
      },
      cancel() {
        cancelled = true;
        clearTimeout(timer);
      },
    };
    function complete() {
      if (done) return;
      done = true;
      if (api.onDone) api.onDone();
    }
    function tick() {
      if (cancelled) return;
      if (i >= spans.length) { complete(); return; }
      const ch = chars[i];
      spans[i++].classList.add('on');
      let d = speed * (0.7 + Math.random() * 0.6);
      if ('.!?…'.includes(ch)) d = speed * 8;
      else if (',;:—–'.includes(ch)) d = speed * 4.5;
      else if (ch === ' ') d = speed * 0.8;
      timer = setTimeout(tick, d);
    }
    return api;
  }

  /* ================= toxunuş ================= */
  function tapStar(st) {
    if (busy || current) return;
    if (phase !== 'play' && phase !== 'final') return;
    if (!st.el.classList.contains('shown')) return;
    busy = true;
    ensureAudio();
    bell(st.note, 0.9);
    buzz(10);
    st.pop = clock;
    st.popAmp = 0.34;
    burst(st.x, st.y);
    const firstTime = !st.opened;
    if (firstTime) {
      st.opened = true;
      st.el.classList.add('open');
    }
    hintEl.classList.remove('show');
    later(0.34, () => {
      busy = false;
      openCard(st, firstTime);
    });
  }

  function openCard(st, firstTime) {
    current = { st, firstTime };
    if (typer) typer.cancel();
    typer = makeTyper(msgEl, st.msg, 46);
    card.setAttribute('aria-label', `Ulduz ${st.i + 1}`);
    // kart ulduzun içindən böyüsün
    const ox = st.x - card.offsetLeft;
    const oy = st.y - card.offsetTop;
    card.style.transformOrigin = `${ox.toFixed(1)}px ${oy.toFixed(1)}px`;
    void card.offsetWidth;
    overlay.classList.add('show');
    card.scrollTop = 0;
    const t = typer;
    later(0.3, () => t.start());
    try { closeBtn.focus({ preventScroll: true }); } catch (e) { /* */ }
  }

  function closeCard() {
    if (!current) return;
    const { st, firstTime } = current;
    current = null;
    if (typer) typer.cancel();
    const ox = st.x - card.offsetLeft;
    const oy = st.y - card.offsetTop;
    card.style.transformOrigin = `${ox.toFixed(1)}px ${oy.toFixed(1)}px`;
    overlay.classList.remove('show');
    try { st.el.blur(); closeBtn.blur(); } catch (e) { /* */ }
    later(0.38, () => {
      st.pop = clock;
      st.popAmp = 0.18;
    });
    if (firstTime) {
      later(0.42, () => {
        openedCount = stars.filter((s) => s.opened).length;
        updateCounter(true);
        if (openedCount >= N && phase === 'play') later(1.1, startFinale);
      });
    }
  }

  function updateCounter(bump) {
    cntEl.textContent = String(openedCount);
    counterEl.classList.toggle('full', N > 0 && openedCount >= N);
    if (bump) {
      counterEl.classList.remove('bump');
      void counterEl.offsetWidth;
      counterEl.classList.add('bump');
    }
  }

  // Barmağın həqiqətən harada toxunduğunu yadda saxlayırıq: brauzer kartın
  // kənarına yaxın toxunuşu karta "yapışdıra" bilər, bu isə bağlanmanı pozur.
  let downOnBackdrop = false;
  overlay.addEventListener('pointerdown', (e) => {
    const r = card.getBoundingClientRect();
    downOnBackdrop = e.target === overlay ||
      e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
  });
  card.addEventListener('click', () => {
    if (downOnBackdrop) return;
    if (typer && !typer.done) typer.finish();
  });
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    closeCard();
  });
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay || downOnBackdrop) {
      downOnBackdrop = false;
      closeCard();
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeCard();
  });
  finalCard.addEventListener('click', () => {
    if (finalTyper && !finalTyper.done) finalTyper.finish();
  });
  // iOS-da :active effekti üçün
  document.addEventListener('touchstart', () => {}, { passive: true });
  document.addEventListener('gesturestart', (e) => e.preventDefault());

  /* ================= giriş ================= */
  startBtn.addEventListener('click', () => {
    if (phase !== 'intro') return;
    ensureAudio();
    bell(1174.66, 0.45);
    bell(1567.98, 0.32, 0.16, 2.6);
    intro.classList.add('hide');
    phase = 'play';
    setTimeout(() => intro.classList.add('gone'), 1700);
    if (!N) {
      later(1.0, showFinal);
      return;
    }
    const order = stars.slice().sort(() => Math.random() - 0.5);
    order.forEach((st, k) => later(0.55 + k * 0.17, () => st.el.classList.add('shown')));
    later(0.55 + N * 0.17 + 0.5, () => {
      counterEl.classList.add('show');
      if (openedCount === 0) hintEl.classList.add('show');
    });
  });

  /* ================= final ================= */
  function startFinale() {
    if (phase !== 'play') return;
    phase = 'forming';
    document.body.classList.add('forming');
    hintEl.classList.remove('show');
    later(0.4, () => counterEl.classList.remove('show'));
    stage = 'center';
    heart = geomCenter();
    heartAnim = null;
    hg = heart;
    assignHeart();
    mode = 'heart';
    driftT = 0.12;
    stars.forEach((st) => {
      st.tw = {
        fx: st.ax, fy: st.ay,
        t0: clock + rand(0, 0.55),
        dur: rand(3.1, 3.7),
        bend: rand(0.12, 0.24) * (Math.random() < 0.5 ? -1 : 1),
      };
    });
    // yumşaq, yüksələn parıltı səsi
    [0, 1, 2, 3].forEach((k) => bell(ARP[k * 2] || 1567.98, 0.22, 0.25 + k * 0.42, 2.6));
    later(4.5, drawConstellation);
  }
  function drawConstellation() {
    lines.on = true;
    lines.t0 = clock;
    lines.alpha = 1;
    lines.target = 1;
    const steps = Math.ceil(N / 2);
    for (let s = 0; s < steps; s++) later(s * STEP + 0.05, () => bell(ARP[s % ARP.length], 0.5, 0, 2.4));
    later(steps * STEP + 0.35, heartDone);
  }
  function heartDone() {
    glowT = 1;
    beatT = 0.03;
    if (AC) {
      [392.0, 493.88, 587.33, 783.99].forEach((f, k) => pad(f, 1, k * 0.07, 0.7, 4.8));
      bell(1567.98, 0.3, 0.55, 3.2);
    }
    stars.forEach((st, k) => later(k * 0.05, () => { st.pop = clock; st.popAmp = 0.22; }));
    later(2.6, showFinal);
  }
  function showFinal() {
    if (finalTyper) finalTyper.cancel();
    finalTyper = makeTyper(finalMsg, FINAL_TEXT, 50);
    finalTyper.onDone = () => later(1.2, () => againBtn.classList.add('show'));
    finalCard.scrollTop = 0;
    if (N) {
      stage = 'top';
      const to = geomTop();
      heartAnim = { from: hg, to, t0: clock, dur: 2.3 };
      heart = to;
    }
    later(N ? 1.1 : 0, () => {
      finale.classList.add('show');
      phase = 'final';
      document.body.classList.remove('forming');
    });
    const t = finalTyper;
    later(N ? 2.1 : 1.0, () => t.start());
  }
  function restart() {
    if (phase !== 'final') return;
    ensureAudio();
    bell(1174.66, 0.4);
    againBtn.classList.remove('show');
    finale.classList.remove('show');
    if (finalTyper) finalTyper.cancel();
    later(1.3, () => {
      if (phase !== 'final') { finalMsg.textContent = ''; }
    });
    lines.target = 0;
    glowT = 0;
    beatT = 0;
    stars.forEach((st) => {
      st.opened = false;
      st.el.classList.remove('open');
    });
    openedCount = 0;
    updateCounter(false);
    mode = 'scatter';
    stage = 'center';
    driftT = 1;
    makeLayout();
    stars.forEach((st) => {
      st.tw = { fx: st.ax, fy: st.ay, t0: clock + rand(0, 0.4), dur: rand(2.4, 3), bend: rand(0.1, 0.2) * (Math.random() < 0.5 ? -1 : 1) };
    });
    phase = 'play';
    later(1.4, () => {
      counterEl.classList.add('show');
      if (openedCount === 0) hintEl.classList.add('show');
    });
  }
  againBtn.addEventListener('click', restart);

  /* ================= effektlər ================= */
  const parts = [], rings = [], motes = [];
  let fxDirty = false;
  function burst(x, y) {
    rings.push({ x, y, t: 0, max: 0.8 });
    const n = reduceMotion ? 10 : 24;
    for (let k = 0; k < n; k++) {
      const a = Math.random() * TAU;
      const sp = 50 + Math.random() * 210;
      parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 15,
        t: 0,
        max: 0.55 + Math.random() * 0.75,
        r: 0.8 + Math.random() * 1.8,
        spark: Math.random() < 0.38,
        spr: Math.random() < 0.6 ? SPR.gold : SPR.white,
      });
    }
  }

  /* ================= ölçü dəyişəndə ================= */
  function resize() {
    const nw = window.innerWidth, nh = window.innerHeight;
    if (nw === W && nh === H) return;
    const first = W === 0;
    const ow = W, oh = H;
    W = nw; H = nh;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of [bg, fx]) {
      c.width = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
    }
    fxDirty = true;
    landscape = W > H * 1.08;
    document.body.classList.toggle('landscape', landscape);
    S = Math.round(clamp(Math.min(W, H) * 0.165, 56, 78));
    AMP = Math.min(W, H) * (reduceMotion ? 0.014 : 0.036);
    document.documentElement.style.setProperty('--star-size', S + 'px');

    if (first || Math.abs(W * H - fieldArea) / fieldArea > 0.35) {
      buildField();
    } else {
      const kx = W / ow, ky = H / oh;
      for (const s of field) { s.x *= kx; s.y *= ky; }
      for (const s of sparkles) { s.x *= kx; s.y *= ky; }
    }

    if (first) {
      makeLayout();
      stars.forEach((st) => {
        st.ax = st.bx; st.ay = st.by;
        st.x = st.bx; st.y = st.by;
      });
      return;
    }
    if (mode === 'scatter') {
      if (!remapLayout()) {
        makeLayout();
        stars.forEach((st) => {
          st.tw = { fx: st.ax, fy: st.ay, t0: clock, dur: 1.4, bend: 0 };
        });
      }
    } else {
      heart = stage === 'top' ? geomTop() : geomCenter();
      heartAnim = null;
    }
  }
  let resizeRaf = 0;
  const onResize = () => {
    if (resizeRaf) return;
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = 0;
      resize();
    });
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

  /* ================= kadr ================= */
  function updateStars(dt) {
    hg = heartNow();
    const k = 1 - Math.exp(-dt * 2.2);
    drift += (driftT - drift) * k;
    glow += (glowT - glow) * (1 - Math.exp(-dt * 1.4));
    beatAmt += (beatT - beatAmt) * (1 - Math.exp(-dt * 1.5));
    beatVal = beatShape(clock);
    const target = mode === 'heart' && N ? clamp((HEART.perim * hg.w) / N / (S * 1.12), 0.55, 1) : 1;
    sScale += (target - sScale) * (1 - Math.exp(-dt * 1.8));
    const pulse = 1 + beatAmt * beatVal;
    const half = S / 2;

    for (const st of stars) {
      let tx, ty;
      if (mode === 'heart') {
        const p = HP[st.hk];
        tx = hg.cx + p.x * hg.w * pulse;
        ty = hg.cy + p.y * hg.w * HEART_RATIO * pulse;
      } else {
        tx = st.bx;
        ty = st.by;
      }
      if (st.tw) {
        const u = (clock - st.tw.t0) / st.tw.dur;
        if (u >= 1) {
          st.tw = null;
        } else {
          const e = easeIO(clamp(u, 0, 1));
          const dx = tx - st.tw.fx, dy = ty - st.tw.fy;
          const b = Math.sin(Math.PI * e) * st.tw.bend;
          tx = st.tw.fx + dx * e - dy * b;
          ty = st.tw.fy + dy * e + dx * b;
        }
      }
      st.ax = tx;
      st.ay = ty;
      const a = AMP * drift;
      const ox = (a * (Math.sin(clock * st.w1 + st.p1) + 0.4 * Math.sin(clock * st.w2 * 1.7 + st.p2))) / 1.4;
      const oy = (a * (Math.cos(clock * st.w2 + st.p2) + 0.4 * Math.sin(clock * st.w1 * 1.3 + st.p1))) / 1.4;
      st.x = tx + ox;
      st.y = ty + oy;
      let sc = sScale;
      if (st.pop >= 0) {
        const pu = (clock - st.pop) / 0.7;
        if (pu >= 1) st.pop = -1;
        else if (pu > 0) sc *= 1 + st.popAmp * Math.sin(Math.PI * pu) * (1 - pu * 0.3);
      }
      st.el.style.transform = `translate3d(${(st.x - half).toFixed(2)}px,${(st.y - half).toFixed(2)}px,0) scale(${sc.toFixed(3)})`;
    }
  }

  function drawBg(dt) {
    const c = bctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    c.globalCompositeOperation = 'lighter';
    const dk = reduceMotion ? 0.2 : 1;

    // fon ulduzları — yavaş axır və parıldayır
    for (const s of field) {
      s.x -= s.v * dt * dk;
      s.y -= s.v * 0.16 * dt * dk;
      if (s.x < -6) s.x += W + 12;
      if (s.y < -6) s.y += H + 12;
      const tw = 0.5 + 0.5 * Math.sin(clock * s.s + s.p);
      c.globalAlpha = s.a * (0.3 + 0.7 * tw * tw);
      const z = s.r * 7;
      c.drawImage(s.spr, s.x - z / 2, s.y - z / 2, z, z);
    }
    // parlaq, şüalı ulduzlar
    c.lineCap = 'round';
    for (const s of sparkles) {
      s.x -= s.v * dt * dk;
      s.y -= s.v * 0.16 * dt * dk;
      if (s.x < -10) s.x += W + 20;
      if (s.y < -10) s.y += H + 20;
      const tw = 0.5 + 0.5 * Math.sin(clock * s.s + s.p);
      const z = s.r * 9;
      c.globalAlpha = 0.45 + 0.55 * tw;
      c.drawImage(s.spr, s.x - z / 2, s.y - z / 2, z, z);
      const L = 3 + 7 * tw * tw;
      c.globalAlpha = 0.18 + 0.4 * tw;
      c.strokeStyle = '#e8eeff';
      c.lineWidth = 0.7;
      c.beginPath();
      c.moveTo(s.x - L, s.y); c.lineTo(s.x + L, s.y);
      c.moveTo(s.x, s.y - L); c.lineTo(s.x, s.y + L);
      c.stroke();
    }

    // axan ulduzlar
    nextShoot -= dt;
    if (nextShoot <= 0) {
      spawnShooter();
      nextShoot = reduceMotion ? rand(16, 26) : rand(4.5, 11);
    }
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.t += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      const u = s.t / s.max;
      if (u >= 1) { shooters.splice(i, 1); continue; }
      const al = Math.sin(Math.PI * u);
      const sp = Math.hypot(s.vx, s.vy);
      const tx = s.x - (s.vx / sp) * s.len, ty = s.y - (s.vy / sp) * s.len;
      const g = c.createLinearGradient(tx, ty, s.x, s.y);
      g.addColorStop(0, 'rgba(255,255,255,0)');
      g.addColorStop(0.7, `rgba(210,220,255,${0.35 * al})`);
      g.addColorStop(1, `rgba(255,255,255,${0.95 * al})`);
      c.globalAlpha = 1;
      c.strokeStyle = g;
      c.lineWidth = 1.6;
      c.beginPath();
      c.moveTo(tx, ty);
      c.lineTo(s.x, s.y);
      c.stroke();
      c.globalAlpha = al;
      c.drawImage(SPR.white, s.x - 6, s.y - 6, 12, 12);
    }

    // ürəyin çəhrayı işığı
    if (glow > 0.003 && N) {
      const k = hg.w / HSPR.ref;
      c.globalAlpha = glow * (0.55 + 0.3 * beatVal);
      c.drawImage(HSPR.c, hg.cx - (HSPR.c.width * k) / 2, hg.cy - (HSPR.c.height * k) / 2, HSPR.c.width * k, HSPR.c.height * k);
    }

    // bürc xətləri
    lines.alpha += (lines.target - lines.alpha) * (1 - Math.exp(-dt * 2));
    if (lines.on && lines.target === 0 && lines.alpha < 0.01) lines.on = false;
    if (lines.on && N > 1) drawLines(c);

    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  }

  const byK = [];
  function drawLines(c) {
    for (const st of stars) byK[st.hk] = st;
    const el = clock - lines.t0;
    c.lineCap = 'round';
    for (let i = 0; i < N; i++) {
      const step = Math.min(i, N - 1 - i);
      let p = (el - step * STEP) / STEP;
      if (p <= 0) continue;
      p = p >= 1 ? 1 : easeOut(p);
      let A = byK[i], B = byK[(i + 1) % N];
      if (i > N - 1 - i) { const t = A; A = B; B = t; }
      if (!A || !B) continue;
      const x2 = A.x + (B.x - A.x) * p, y2 = A.y + (B.y - A.y) * p;
      const sh = 0.82 + 0.18 * Math.sin(clock * 1.6 + i * 0.9);
      const al = lines.alpha * sh;
      c.beginPath();
      c.moveTo(A.x, A.y);
      c.lineTo(x2, y2);
      c.globalAlpha = 0.16 * al;
      c.strokeStyle = '#ff9fc4';
      c.lineWidth = 8;
      c.stroke();
      c.globalAlpha = 0.42 * al;
      c.strokeStyle = '#ffd39a';
      c.lineWidth = 3.2;
      c.stroke();
      c.globalAlpha = 0.95 * al;
      c.strokeStyle = '#fff6e4';
      c.lineWidth = 1.3;
      c.stroke();
      if (p < 1) {
        c.globalAlpha = al;
        c.drawImage(SPR.gold, x2 - 11, y2 - 11, 22, 22);
        c.drawImage(SPR.white, x2 - 5, y2 - 5, 10, 10);
      }
    }
  }

  // Ürək işığı üçün bir dəfə çəkilən şəkil
  const HSPR = (() => {
    const ref = 300, pad = 100;
    const c = document.createElement('canvas');
    c.width = ref + pad * 2;
    c.height = Math.round(ref * HEART_RATIO) + pad * 2;
    const g = c.getContext('2d');
    g.translate(c.width / 2, c.height / 2);
    // Yalnız bulanıq kölgəni çəkirik (fiqurun özü kətandan kənarda qalır) —
    // nəticədə kəskin kənarı olmayan, dumanlı bir işıq alınır.
    const OFF = 4000;
    const shape = (scale) => {
      const path = new Path2D();
      for (let k = 0; k <= 200; k++) {
        const p = heartCurve((TAU * k) / 200);
        const x = (p.x / 32) * ref * scale - OFF, y = ((p.y - 2.5) / 29) * ref * HEART_RATIO * scale;
        if (k === 0) path.moveTo(x, y); else path.lineTo(x, y);
      }
      path.closePath();
      return path;
    };
    g.shadowOffsetX = OFF;
    g.fillStyle = '#000';
    g.shadowColor = 'rgba(255, 118, 172, .42)';
    g.shadowBlur = 64;
    g.fill(shape(0.86));
    g.shadowColor = 'rgba(255, 170, 200, .30)';
    g.shadowBlur = 34;
    g.fill(shape(0.7));
    return { c, ref };
  })();

  function drawFx(dt) {
    // finalda ürəkdən yuxarı qalxan kiçik işıqlar
    if (phase === 'final' && glow > 0.3 && N && !reduceMotion) {
      moteTimer -= dt;
      if (moteTimer <= 0 && motes.length < 36) {
        moteTimer = rand(0.14, 0.3);
        motes.push({
          x: hg.cx + rand(-0.42, 0.42) * hg.w,
          y: hg.cy + rand(-0.25, 0.4) * hg.w * HEART_RATIO,
          vx: rand(-5, 5), vy: -rand(10, 24),
          t: 0, max: rand(2.6, 4.6), r: rand(0.6, 1.5),
          spr: Math.random() < 0.5 ? SPR.rose : SPR.gold,
        });
      }
    }
    const any = parts.length || rings.length || motes.length;
    if (!any && !fxDirty) return;
    const c = fctx;
    c.setTransform(DPR, 0, 0, DPR, 0, 0);
    c.clearRect(0, 0, W, H);
    fxDirty = !!any;
    if (!any) return;
    c.globalCompositeOperation = 'lighter';
    for (let i = rings.length - 1; i >= 0; i--) {
      const r = rings[i];
      r.t += dt;
      const u = r.t / r.max;
      if (u >= 1) { rings.splice(i, 1); continue; }
      c.globalAlpha = 0.55 * Math.pow(1 - u, 2);
      c.strokeStyle = '#ffe2a8';
      c.lineWidth = 1.6 * (1 - u) + 0.4;
      c.beginPath();
      c.arc(r.x, r.y, S * 0.3 + easeOut(u) * S * 1.1, 0, TAU);
      c.stroke();
    }
    const drag = Math.exp(-dt * 3.2);
    c.lineCap = 'round';
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t += dt;
      const u = p.t / p.max;
      if (u >= 1) { parts.splice(i, 1); continue; }
      p.vx *= drag;
      p.vy = p.vy * drag + 18 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const al = Math.pow(1 - u, 1.4);
      const z = p.r * 6;
      c.globalAlpha = al;
      c.drawImage(p.spr, p.x - z / 2, p.y - z / 2, z, z);
      if (p.spark) {
        const L = p.r * 3.2 * (0.6 + 0.4 * Math.sin(u * 9));
        c.globalAlpha = al * 0.8;
        c.strokeStyle = '#fff3d6';
        c.lineWidth = 0.8;
        c.beginPath();
        c.moveTo(p.x - L, p.y); c.lineTo(p.x + L, p.y);
        c.moveTo(p.x, p.y - L); c.lineTo(p.x, p.y + L);
        c.stroke();
      }
    }
    for (let i = motes.length - 1; i >= 0; i--) {
      const m = motes[i];
      m.t += dt;
      const u = m.t / m.max;
      if (u >= 1) { motes.splice(i, 1); continue; }
      m.x += (m.vx + Math.sin(clock * 1.3 + i) * 4) * dt;
      m.y += m.vy * dt;
      c.globalAlpha = Math.sin(Math.PI * u) * 0.85 * glow;
      const z = m.r * 7;
      c.drawImage(m.spr, m.x - z / 2, m.y - z / 2, z, z);
    }
    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
  }

  let last = 0;
  function frame(now) {
    let dt = last ? (now - last) / 1000 : 0.016;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    clock += dt;
    runQueue();
    updateStars(dt);
    drawBg(dt);
    drawFx(dt);
    requestAnimationFrame(frame);
  }

  /* ================= başlanğıc ================= */
  resize();
  updateCounter(false);
  requestAnimationFrame(frame);

  const ready = () => document.body.classList.add('ready');
  try {
    if (document.fonts && document.fonts.load) {
      Promise.race([
        Promise.all([
          document.fonts.load('italic 500 32px "Cormorant Garamond"', 'əşçğıöü'),
          document.fonts.load('500 20px "Cormorant Garamond"', 'əşçğıöü'),
        ]),
        new Promise((r) => setTimeout(r, 1500)),
      ]).then(ready, ready);
    } else {
      ready();
    }
  } catch (e) {
    ready();
  }
})();
</script>
</body>
</html>
